<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040814"/>
      <stop offset="50%" stop-color="#09142b"/>
      <stop offset="100%" stop-color="#02050e"/>
    </linearGradient>

    <!-- Center Glow -->
    <radialGradient id="centerGlow" cx="50%" cy="48%" r="60%">
      <stop offset="0%" stop-color="#00b4d8" stop-opacity="0.32"/>
      <stop offset="50%" stop-color="#0077b6" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>

    <!-- Crisp Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176"/>
      <stop offset="45%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>

    <!-- Super Crisp Cyan Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="40%" stop-color="#00d2ff"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>

    <!-- Metallic White Gradient for STF -->
    <linearGradient id="whiteGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Border Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9"/>
      <stop offset="30%" stop-color="#00b4d8" stop-opacity="0.5"/>
      <stop offset="70%" stop-color="#fbbf24" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Crisp Needle-Sharp Shadow (Low blur for maximum clarity) -->
    <filter id="crispShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="3" flood-color="#000000" flood-opacity="0.9"/>
    </filter>
  </defs>

  <!-- App Squircle Background -->
  <rect x="14" y="14" width="484" height="484" rx="108" fill="url(#bgGrad)"/>
  <rect x="14" y="14" width="484" height="484" rx="108" fill="url(#centerGlow)"/>

  <!-- High-end Outer Border -->
  <rect x="16" y="16" width="480" height="480" rx="106" fill="none" stroke="url(#ringGrad)" stroke-width="5.5"/>

  <!-- Inner Inset Frame -->
  <rect x="28" y="28" width="456" height="456" rx="96" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>

  <!-- Top Elegant Stylized STF Diamond Emblem (Compact) -->
  <g transform="translate(256, 100)" filter="url(#crispShadow)">
    <!-- Tech Diamond Outer -->
    <path d="M-60 0 L-25 -24 L0 -34 L25 -24 L60 0 L30 14 L0 22 L-30 14 Z" fill="#071329" stroke="url(#goldGrad)" stroke-width="2.5" stroke-linejoin="round"/>
    
    <!-- Central Hexagon Lab Beaker Icon -->
    <polygon points="0,-20 18,-9 18,9 0,20 -18,9 -18,-9" fill="#0e234a" stroke="url(#cyanGrad)" stroke-width="2.5"/>
    
    <!-- Monogram 'T' in gold -->
    <path d="M-8 -6 L8 -6 M0 -6 L0 10" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round"/>
    
    <!-- Dots -->
    <circle cx="-38" cy="0" r="3" fill="#38bdf8"/>
    <circle cx="38" cy="0" r="3" fill="#fbbf24"/>
  </g>

  <!-- HERO CENTERPIECE: GIANT ULTRA-CRISP "STFLAB" -->
  <g filter="url(#crispShadow)">
    <text x="256" y="278" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, 'Segoe UI', Montserrat, 'Arial Black', Roboto, sans-serif" 
          font-weight="950" 
          font-size="108" 
          letter-spacing="2"
          stroke="#010612"
          stroke-width="5"
          paint-order="stroke fill">
      <tspan fill="url(#whiteGrad)">STF</tspan><tspan fill="url(#cyanGrad)">LAB</tspan>
    </text>
  </g>

  <!-- Sharp Neon Laser Divider -->
  <g>
    <path d="M80 308 L210 308 L256 316 L302 308 L432 308" fill="none" stroke="url(#cyanGrad)" stroke-width="4.5" stroke-linecap="round"/>
    <circle cx="256" cy="316" r="5" fill="#fef08a" stroke="#040814" stroke-width="2"/>
  </g>

  <!-- High-Contrast Badge: CONTROL CALIDAD -->
  <g transform="translate(256, 372)" filter="url(#crispShadow)">
    <!-- Pill Container -->
    <rect x="-155" y="-22" width="310" height="44" rx="22" fill="#0b1a36" stroke="url(#goldGrad)" stroke-width="2.5"/>
    <text x="0" y="7" 
          text-anchor="middle" 
          font-family="system-ui, -apple-system, Inter, 'Arial Black', sans-serif" 
          font-weight="900" 
          font-size="17" 
          fill="#ffffff" 
          letter-spacing="3.5">
      CONTROL CALIDAD
    </text>
  </g>

  <!-- STF GROUP S.A. Tagline -->
  <text x="256" y="445" 
        text-anchor="middle" 
        font-family="system-ui, -apple-system, Inter, sans-serif" 
        font-weight="800" 
        font-size="13" 
        fill="#94a3b8" 
        letter-spacing="4.5">
    STF GROUP S.A.
  </text>
</svg>

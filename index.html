    <!-- Inicializador Instantáneo de Tema (Persistencia Modo Claro / Oscuro al ingresar) -->
    <script>
      (function() {
        try {
          var t = localStorage.getItem('stflab_app_theme') || 'dark';
          var root = document.documentElement;
          if (t === 'light') {
            root.classList.remove('dark');
            root.classList.add('light');
            root.setAttribute('data-theme', 'light');
          } else {
            root.classList.remove('light');
            root.classList.add('dark');
            root.setAttribute('data-theme', 'dark');
          }
          var fs = localStorage.getItem('stflab_app_font_size') || 'mediana';
          root.setAttribute('data-font-size', fs);
          root.classList.add('font-' + fs);
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="min-h-screen antialiased selection:bg-[#00b4d8]/30">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Actualizador en Tiempo Real (Limpieza de SW / Caché Obsoleto) -->
    <script>
      (function() {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          }).catch(function() {});
        }
        if ('caches' in window) {
          caches.keys().then(function(names) {
            for (var j = 0; j < names.length; j++) {
              if (names[j].startsWith('studio-f-lab')) {
                caches.delete(names[j]);
              }
            }
          }).catch(function() {});
        }
      })();
    </script>
  </body>
